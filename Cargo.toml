[package]
name = "physics_sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
avian3d = "0.8.0"
bevy = "0.20.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Keep validation builds fast without changing the runtime development profile.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0

[profile.ci.package."*"]
opt-level = 0
