name: Portable Windows Build

on:
  push:
    branches:
      - main
      - feature/human-ragdoll-actions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build portable Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-portable-release

      - name: Validate Rust sources
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Build portable folder and ZIP
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable archive contents
        shell: pwsh
        run: |
          $Archive = "dist/physics-sandbox-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $Archive -PathType Leaf)) {
              throw "Portable archive was not created."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $Archive))
          try {
              $Names = $Zip.Entries.FullName
              foreach ($Required in @(
                  "physics_sandbox.exe",
                  "Physics Sandbox.cmd",
                  "README-PORTABLE.txt",
                  "data/engine.json",
                  "data/materials.json",
                  "data/components.json",
                  "assets/ui/main_menu.json",
                  "worlds/.gitkeep"
              )) {
                  if ($Names -notcontains $Required) {
                      throw "Portable archive is missing '$Required'."
                  }
              }
          }
          finally {
              $Zip.Dispose()
          }

      - name: Upload portable Windows x64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: physics-sandbox-windows-x64
          path: |
            dist/physics-sandbox-windows-x64.zip
            dist/physics-sandbox-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
