name: Check Rust formatting

on:
  push:
    branches:
      - feature/human-ragdoll-actions
    paths:
      - "src/**/*.rs"
      - .github/workflows/format-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustfmt-human-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Install stable Rust with rustfmt
        run: |
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Verify all Rust sources are formatted
        run: cargo fmt --all -- --check
