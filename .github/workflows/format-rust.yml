name: Format Rust sources

on:
  push:
    branches:
      - feature/human-ragdoll-actions
    paths:
      - src/human/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustfmt-human-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install stable Rust with rustfmt
        run: |
          rustup toolchain install stable --component rustfmt
          rustup default stable

      - name: Format all Rust sources
        run: cargo fmt --all

      - name: Commit formatting changes to the feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git commit -m "Format Rust sources"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH_NAME}"
