name: Convert human FBX model

on:
  push:
    branches:
      - feature/human-ragdoll-actions
    paths:
      - assets/human/Character_Rig.fbx
      - data/human/human.json
      - data/human/actions/idle.json
      - scripts/convert_human_model.py
      - .github/workflows/convert-human-model.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-human-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Convert FBX deformation rig to GLB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender python3-numpy
      - name: Convert source FBX without creating animation clips
        run: blender --background --factory-startup --python scripts/convert_human_model.py
      - name: Commit generated GLB to the feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/human/Character_Rig.glb data/human/rig.json
          if git diff --cached --quiet; then
            echo "Generated GLB is already up to date."
            exit 0
          fi
          git commit -m "Generate Bevy-compatible human model asset"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH_NAME}"
